<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="application-name" content="로켓보안">
  <meta name="theme-color" content="#f8f8f4">
  <title>고객 계정 · 로켓보안</title>
  <link rel="icon" type="image/png" href="/assets/rocket-mark.png">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/SUIT-Variable.woff2" crossorigin>
  <link rel="stylesheet" href="/account.css">
  <script src="/account.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header><div class="frame bar">
    <a class="brand" href="https://happytoto.github.io/soc/"><img src="/assets/rocket-mark.png" alt="" width="30" height="30">로켓보안</a>
    <a class="home" href="https://happytoto.github.io/soc/">홈페이지로</a>
  </div></header>
  <main id="main" class="frame">
    <h1>고객 계정</h1>
    <p class="lead">웹 점검 이용권을 주문하고 내 결제 내역을 확인하세요.</p>
    <noscript><p class="notice">로그인과 결제 내역을 이용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    <div id="return-panel" class="notice" hidden>
      <h2 id="return-title">결제 결과 확인</h2>
      <p id="return-status" role="status"></p>
      <div class="actions"><a id="relogin" class="button" href="/api/auth?action=login" target="_blank" rel="noopener noreferrer" hidden>새 탭에서 로그인</a>
      <button id="retry-confirm" type="button" hidden>승인 결과 다시 확인</button></div>
    </div>
    <section class="account section" aria-labelledby="account-title">
      <div><h2 id="account-title">로그인</h2><p id="account-status" class="muted" role="status">계정 연결 상태를 확인하고 있습니다.</p></div>
      <div class="actions">
        <a id="login" class="button primary" href="/api/auth?action=login" hidden>Google로 로그인</a>
        <button id="logout" type="button" hidden>로그아웃</button>
        <button id="refresh" type="button" hidden>연결 상태 새로고침</button>
      </div>
    </section>
    <section class="section purchase" aria-labelledby="order-title">
      <div><h2 id="order-title">웹 점검 이용권</h2><p class="muted" id="billing-status">주문 가능 여부를 확인하고 있습니다.</p></div>
      <form id="order" hidden>
        <label for="qty">점검 도메인 수</label>
        <select id="qty" name="quantity">
          <option value="1">1개</option><option value="2">2개</option><option value="3">3개</option>
        </select>
        <div class="total"><span>주문 합계</span><output id="sum" for="qty"></output></div>
        <button id="buy" class="primary" type="submit">결제창 열기</button>
      </form>
      <p id="checkout-status" class="feedback" role="status"></p>
    </section>
    <section id="history" class="section" aria-labelledby="history-title" hidden>
      <div class="account"><h2 id="history-title">내 주문 내역</h2><button id="load-history" type="button">내역 새로고침</button></div>
      <p class="muted" id="history-status" role="status"></p><ol id="orders"></ol>
      <button id="more" type="button" hidden>이전 주문 더 보기</button>
    </section>
    <footer><a href="https://happytoto.github.io/soc/examples/rocket-portal/">샘플 고객 포털 체험</a><a href="https://happytoto.github.io/soc/#contact">운영팀에 문의</a></footer>
  </main>
</body>
</html>
