<style>

:root{color-scheme:light;--ink:#172c2b;--muted:#566865;--green:#126352;--deep:#11483e;--pale:#e7f2ed;--border:#dce5e0;--subtle:#f5f8f6;--paper:#fff;--page:#f5f7f4;--sand:#f6efe2;--alert:#914631;font-family:"Instrument Sans","Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);background:var(--page);font-size:15px;line-height:1.58}

.mark i:nth-child(2){width:11px}.mark i:nth-child(3){width:8px}

.project div{min-width:0}.project strong,.project small{display:block;overflow-wrap:anywhere}.project strong{font-size:15px}.project small{font-size:11px;color:var(--muted);margin-top:1px}

#nav{display:grid;gap:5px}.nav-button{border:1px solid transparent;background:transparent;text-align:left;width:100%;display:flex;align-items:center;gap:11px;border-radius:9px;padding:9px 10px;color:#425653;min-height:55px}.nav-button:hover{background:#edf3ee}.nav-button[aria-current=step]{border-color:#d3e4db;background:#e5f0e9;color:var(--deep)}.nav-button:disabled{opacity:.6;cursor:default;background:transparent}.step-no{flex:0 0 29px;width:29px;height:29px;display:grid;place-content:center;background:#edf2ee;border:1px solid #dce6df;border-radius:7px;font-size:11px;font-weight:750}.nav-button[aria-current=step] .step-no{color:white;background:var(--deep);border-color:var(--deep)}.nav-button.done .step-no{color:var(--green)}.nav-title{display:block;font-weight:750;font-size:13px}.nav-desc{display:block;font-size:11px;color:var(--muted);line-height:1.4}.side-bottom{border-top:1px solid var(--border);margin-top:23px;padding:15px 10px 0;display:flex;flex-wrap:wrap;gap:9px 15px;font-size:12px}.side-bottom > *{white-space:nowrap}

.hero p{margin:7px 0 0;color:#d1e7dc;font-size:13px;max-width:600px}
.hero .eyebrow{margin:0 0 5px;color:#acd7c3;font-size:11px;font-weight:750}
h1,h2,h3,p{overflow-wrap:anywhere}h1,h2,h3{line-height:1.25;letter-spacing:-.045em}h1{font-size:clamp(25px,3vw,39px);margin:0;font-weight:800}h2{font-size:21px;margin:0 0 7px}h3{font-size:16px;margin:0 0 7px}
.columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:19px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}.card{border:1px solid var(--border);border-radius:13px;background:var(--paper);padding:22px;min-width:0;box-shadow:0 2px 4px #143d3006}.intro{color:var(--muted);margin:0 0 17px;font-size:13px}.help{color:var(--muted);font-size:12px;margin:5px 0 0}.info{background:#ecf4ef;border:1px solid #d9e8df;border-radius:11px;padding:13px 14px;color:#31554b;font-size:12px}.info p,.warning p{margin:0}.warning{background:#fbf0e8;border:1px solid #efd8ca;border-radius:10px;padding:13px 14px;color:#773e30;font-size:13px}.fine{font-size:12px;color:var(--muted);margin:12px 0 0}
.field{display:block;min-width:0;margin:0 0 15px}.field > span:first-child{display:block;font-weight:750;font-size:13px;margin:0 0 6px}.field input,.field textarea,.field select,.inline-input{width:100%;border:1px solid #cddcd4;border-radius:8px;background:#fcfdfc;color:var(--ink);padding:9px 11px;font-size:14px}.field textarea{display:block;resize:vertical;min-height:78px}.field input::placeholder,.field textarea::placeholder{color:#667773}.field input[type=file]{font-size:12px}.field input[type=file]::file-selector-button{border:1px solid var(--border);border-radius:5px;background:var(--pale);padding:4px 8px;color:var(--deep);margin-right:8px}.field select{padding-right:24px}.field .help{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two > *{min-width:0}.field:last-child{margin-bottom:0}.field.check{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;font-size:13px}.field.check span{margin:0;font-weight:650}.field.check input{width:auto;margin:4px 0 0;accent-color:var(--green)}
.actions,.line-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions{margin-top:19px}.actions .push{margin-left:auto}.button,.quiet{border:1px solid var(--border);background:white;border-radius:8px;padding:8px 13px;min-height:37px;font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px}.quiet{padding:5px 10px;min-height:33px;font-size:12px}.button.primary{color:white;background:var(--deep);border-color:var(--deep)}.button.primary:hover{background:#1e6555}.button:not(.primary):hover,.quiet:hover{background:var(--subtle);border-color:#aac2b5}.button:disabled{opacity:.5;cursor:default}.link-button{border:0;padding:0;background:none;color:var(--green);font-size:inherit;text-align:left}.link-button:hover{text-decoration:underline}
.sample{width:100%;border:1px solid var(--border);background:#f9fbf9;text-align:left;border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin:8px 0 0}.sample:hover{border-color:#80a898;background:#edf5ef}.sample strong,.sample small{display:block}.sample strong{font-size:13px}.sample small{color:var(--muted);font-size:11px;margin-top:2px}.sample b{color:var(--green);font-weight:600}.aside-title{font-size:17px;margin-bottom:7px}.good-list{padding:0;margin:12px 0 0;list-style:none;display:grid;gap:7px}.good-list li{font-size:12px;display:flex;gap:7px;align-items:baseline}.good-list li::before{content:"✓";color:var(--green);font-weight:800}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:4px 0 19px}.dots span{border-radius:10px;height:4px;background:#e5ece8}.dots .done{background:#6d9f8e}.dots .active{background:var(--deep)}
.mini{font-size:11px;font-weight:750;color:var(--green);margin:0 0 6px}.draft{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5ef;border-radius:10px;padding:12px 14px;margin:10px 0 0;color:#264c42;font-size:13px}.tall textarea{min-height:160px}.preview{margin:12px 0 0;padding:14px;background:#f6f8f6;border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 "IBM Plex Mono",Consolas,"Malgun Gothic",monospace;max-height:400px;overflow:auto}
.rule,.record{border:1px solid var(--border);border-radius:9px;padding:13px;margin:10px 0;background:#fcfdfc}.record strong{overflow-wrap:anywhere}.record p{margin:5px 0;color:var(--muted);font-size:13px;white-space:pre-wrap}.tag{display:inline-block;font-size:11px;background:var(--pale);border-radius:5px;color:var(--deep);padding:2px 7px}.tag.bad{background:#fae9e2;color:#783f2a}.tag.pending{background:var(--sand);color:#75531f}.rule-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}.rule-head .quiet{min-height:28px}.rule .field,.record .field{margin-bottom:8px}.rule .field:last-child,.record .field:last-child{margin-bottom:0}details{border-top:1px solid var(--border);padding:10px 0 0;margin-top:11px}summary{cursor:pointer;font-size:13px;font-weight:750;color:var(--deep)}details[open] summary{margin-bottom:9px}
dialog{padding:22px;border:1px solid var(--border);border-radius:14px;background:white;color:var(--ink);width:min(620px,92vw);max-height:88vh;overflow:auto;box-shadow:0 14px 80px #183a3250}dialog::backdrop{background:#17382c74}.modal-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.modal-title h2{margin:0}.modal-title .quiet{width:34px}
#notice{position:fixed;bottom:21px;right:21px;max-width:min(390px,calc(100% - 42px));z-index:8;background:var(--deep);color:white;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 15px #0002}#notice:empty{display:none}
@media(max-width:1000px){.frame{grid-template-columns:195px minmax(0,1fr);gap:21px}.columns{grid-template-columns:minmax(0,1.5fr) minmax(200px,1fr);gap:12px}.card{padding:17px}.hero{padding:24px}}
@media(max-width:800px){.columns{grid-template-columns:1fr}.frame{grid-template-columns:167px minmax(0,1fr)}.nav-button{gap:7px}.nav-desc{font-size:10px}}

</style>
</head>
<body>
<a class="skip" href="#workspace">작업 영역으로 건너뛰기</a>
<header class="top">
  <a class="brand" href="#workspace" aria-label="위임 작업실"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>위임 작업실</a>
  <span class="top-divider"></span><span class="top-sub">업무 매뉴얼 편집기</span>
  <a class="quiet" href="../../">로켓보안 홈</a>
  <div class="top-actions"><span id="save-status" class="saved"><b></b> 이 기기에 자동 저장</span><button class="quiet" data-action="backup">백업</button><button class="quiet" data-action="restore">불러오기</button></div>
</header>
<div class="frame">
  <aside class="sidebar">
    <div class="project"><span class="project-icon" aria-hidden="true">▤</span><div><strong id="project-name">새 위임 매뉴얼</strong><small id="project-slug">업무 하나 · 매뉴얼 하나</small></div></div>
    <div class="progress"><div><span>매뉴얼 작성</span><strong id="progress-label">0 / 5</strong></div><progress id="progress" max="5" value="0"></progress></div>
    <nav id="nav" aria-label="작성 단계"></nav>
    <div class="side-bottom"><a href="https://sdk-kim-builds.com/guides/ai-delegation-loop-playbook/" target="_blank" rel="noopener noreferrer">원본 플레이북 ↗</a><button class="link-button" data-action="survey">사용성 설문</button><button class="link-button" data-action="fresh">새 매뉴얼</button></div>
  </aside>
  <main id="workspace" tabindex="-1"></main>
</div>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<input id="backup-input" type="file" accept=".json,application/json" hidden>
<noscript>위임 작업실을 사용하려면 JavaScript를 켜 주세요.</noscript>
<script>

"use strict";

const PLAN = [
  ["업무 설정", "업무와 참고 자료", "위임할 업무를 고르세요", "반복하는 일 하나와 참고 자료를 적으면, 입력한 문맥에서 인터뷰 답변을 제안합니다."],
  ["프로세스", "인터뷰와 SKILL.md", "업무 판단을 매뉴얼로", "질문을 하나씩 검토합니다. 실제 사례와 판단 기준을 적으면 SKILL.md에 반영됩니다."],
  ["툴박스", "첫 실행과 파일 저장", "잘된 산출물을 다시 쓰기", "업무를 한 번 실행하고 승인한 산출물을 재사용 가능한 파일로 저장하세요."],
  ["증명", "검증 항목과 재실행", "증거로 완료 확인하기", "외부 근거로 실패를 판정할 수 있는 기준을 세우고, 저장된 파일을 써서 다시 실행하세요."],

  ["최종 매뉴얼", "파일 검토와 다운로드", "내 업무의 위임 매뉴얼", "확정한 답변, 재사용 파일, 검증 기준 및 수정 기록을 한 폴더로 받으세요."]

const QUESTIONS = [
  ["어떤 계기로 이 일을 시작하고, 얼마나 자주 하나요?", "실제로 AI에게 입력할 요청 문장과 반복 주기도 적어주세요.", ["계기","빈도","주기","시작","요일","매주","매일","trigger"]],
  ["어떤 입력이 필요하고 정확히 어디에 있나요?", "파일명, 폴더 경로, 기기나 도구 안의 메뉴를 적어주세요.", ["입력","자료","위치","경로","폴더","파일","전사","대시보드","source"]],
  ["실제 일하는 순서를 처음부터 끝까지 적어주세요.", "한 줄에 한 동작을 적으면 SKILL.md에 번호가 붙습니다.", ["순서","단계","진행","처리","흐름","절차","step"]],

  ["끝났다고 말하기 전에 무엇을 확인하나요?", "어디에서 무엇을 대조하고 무엇을 남기는지 적어주세요.", ["완료","확인","검증","납품","결과물","증적","품질"]],
  ["예전에 잘못됐던 사례와 대응은 무엇인가요?", "실제로 발생한 상황과 다음에도 적용할 대응을 적어주세요.", ["예외","오류","실패","누락","사례","문제","중단"]],
  ["결과물의 톤과 형식은 어떤 기준을 따르나요?", "좋았던 결과의 문장이나 형식 예시를 함께 적어주세요.", ["톤","스타일","형식","문체","자막","편집","표기","길이"]],
  ["한눈에 알아보는 나쁜 결과의 특징은 무엇인가요?", "실패한 결과가 무엇을 빠뜨렸거나 잘못했는지 적어주세요.", ["나쁜","금지","반려","부적절","과장","실수","제외"]]
];
const EXAMPLES = {
  shorts:{

    cd.setUint32(16,crc,true);cd.setUint32(20,bytes.length,true);cd.setUint32(24,bytes.length,true);cd.setUint16(28,path.length,true);

}

function diagnose(){
  const issue=q(s.issue.issue);
  if(!issue)return message("실제로 어떤 결과가 나왔고 무엇이 틀렸는지 적어 주세요.");
  const layer=/(다시 만들|중복|오래된|낡|템플릿|참조 파일|스크립트|툴박스|저장.*파일)/i.test(issue)?"toolbox":
    /(검증|확인되지|근거|원본.*없|잘못된 수치|지어낸|통과|일치하)/i.test(issue)?"proof":"process";
  const reasons={
    process:"프로세스에서 필요한 순서 또는 판단 규칙이 빠졌을 수 있습니다. 이 결과가 처음 발생한 단계를 찾아 해당 단계나 결정 규칙을 수정하세요.",
    toolbox:"툴박스에서 재사용할 파일의 내용이나 사용 조건을 확인해야 합니다. 해당 파일 한 개의 내용과 SKILL.md 연결 조건을 먼저 검토하세요.",
    proof:"증명에서 이 오류를 발견할 근거 대조가 빠졌을 수 있습니다. 실제 산출물과 원본의 차이를 판정할 검사 하나를 추가하거나 수정하세요."
  };
  Object.assign(s.issue,{layer,why:reasons[layer],key:s.issue.key||issue.replace(/\s+/g," ").slice(0,80),target:layer==="process"?"decisions":layer==="proof"?"new":s.tools.length?"0":"",before:s.issue.before||issue});
  if(layer==="process")s.issue.change=s.process.decisions+"\n[문제가 생기는 조건]이면 [재발을 막는 조치]를 수행한다.";
  if(layer==="toolbox")s.issue.change=s.tools[0]?.content||"";
  if(layer==="proof")s.issue.change="문제가 된 값이 해당 원본에 있는지 대조한다.";
  render();toast("진단 초안을 만들었습니다. 실제 원인과 수정 문구를 확인하세요.");
}
function issuePlan(){
  const i=s.issue;
  const repeated=i.repeat||s.notes.some(n=>q(n.key).toLowerCase()===q(i.key).toLowerCase());
  if(!q(i.issue)||!q(i.why)||!q(i.key)||!q(i.change)||(i.layer!=="toolbox"&&needsReplace(i.change)))return message("문제와 진단, 실수 이름, 적용할 구체적인 수정 내용을 적어 주세요.");
  if(repeated&&needsReplace(i.rule))return message("같은 문제가 반복됐습니다. 조건과 행동을 담은 명시적인 방지 규칙을 작성하세요.");
  if(i.layer==="process"&&!Object.hasOwn(PROCESS_KEYS,i.target))return message("수정할 프로세스 항목을 골라 주세요.");
  if(i.layer==="toolbox"){
    if(!q(i.target)||!s.tools[Number(i.target)])return message("수정할 재사용 파일을 골라 주세요.");
    const error=toolError({...s.tools[Number(i.target)],content:i.change},s,Number(i.target));
    if(error)return message(error);
  }
  if(i.layer==="proof"&&needsReplace(i.proofEvidence))return message("검증에 사용할 구체적인 원본 파일, 위치 또는 비교 근거를 적으세요.");
  if(i.layer==="proof"&&i.target==="new"&&s.rules.length>=10)return message("이미 검증 10개를 사용하고 있습니다. 고칠 기존 검증 항목을 골라 주세요.");
  if(i.layer==="proof"&&i.target!=="new"&&!s.rules[Number(i.target)])return message("수정할 검증 항목을 골라 주세요.");
  return {...i,repeat:repeated};
}
function applyPatch(target,i){
  if(i.layer==="process")target.process[i.target]=i.change;
  if(i.layer==="toolbox")target.tools[Number(i.target)].content=i.change;
  if(i.layer==="proof"){
    if(i.target==="new")target.rules.push(newRule(i.change,q(i.proofEvidence)||"문제가 발생한 산출물과 원본 또는 실행 증거의 정확한 위치"));
    else {const previous=target.rules[Number(i.target)];target.rules[Number(i.target)]={...previous,name:i.change,evidence:i.proofEvidence};}
  }
  if(i.repeat)target.process.extra=[q(target.process.extra),q(i.rule)].filter(Boolean).join("\n");
}
function logIssue(){
  const plan=issuePlan();
  if(!plan)return;
  const pending=s.pendingPatch;
  const signature=({layer,target,change,rule,proofEvidence,repeat})=>JSON.stringify([layer,target,change,rule,proofEvidence,repeat]);
  if(!pending||signature(pending)!==signature(plan))return message("수정안을 먼저 적용 준비하고 재실행 요청문을 사용하세요.");
  if(!q(plan.before)||!q(plan.after)||!plan.reran)return message("수정 전후 증거를 적고 같은 업무를 처음부터 다시 실행했는지 확인해 주세요.");
  const next=structuredClone(s);
  applyPatch(next,plan);
  const invalidTools=next.tools.some(t=>Number(t.step)>processSteps(next).length);
  if(invalidTools)return message("수정 이후 기존 툴박스 단계 참조가 사라집니다. 단계 번호를 유지하거나 툴박스 참조를 먼저 조정하세요.");
  const invalidRules=rulesError(next);if(invalidRules)return message(invalidRules);
  s=next;
  s.notes.unshift({...plan,date:today()});
  s.issue=issueDraft();s.pendingPatch=null;
  resetProof(s,true);
  s.trial.output=plan.after;
  go(3);toast("수정을 저장했습니다. 수정 후 산출물을 다시 검증하세요.");
}
function validateBackup(input){
  const base=blank();
  if(!input||input.version!==1||!input.job||!Array.isArray(input.answers)||input.answers.length!==8)throw Error("지원하는 매뉴얼 백업 형식이 아닙니다.");
  let fields=0;
  function clean(value,example,depth=0){
    if(++fields>20000||depth>12)throw Error("백업 데이터가 너무 큽니다.");
    if(typeof example==="string")return typeof value==="string"?value.slice(0,240000):example;
    if(typeof example==="boolean")return typeof value==="boolean"?value:example;
    if(typeof example==="number")return Number.isInteger(value)?value:example;
    if(example===null)return null;
    if(Array.isArray(example))return example.map((def,i)=>clean(value?.[i],def,depth+1));
    return Object.fromEntries(Object.keys(example).map(key=>[key,clean(value?.[key],example[key],depth+1)]));
  }
  const restored=clean(input,base);
  const list=(value,schema,max)=>Array.isArray(value)?value.slice(0,max).map(v=>clean(v,schema)):[];
  const op={...toolDraft(),date:""};
  const run={state:"unknown",evidence:"",name:""};
  const manual={state:"unknown",evidence:""};
  restored.stage=Math.min(5,Math.max(0,restored.stage));
  restored.question=Math.min(7,Math.max(0,restored.question));
  if(!["folder","chat"].includes(restored.job.mode))restored.job.mode="folder";
  restored.sources=list(input.sources,{name:"",text:""},6);
  restored.process=input.process?clean(input.process,prepareProcess(restored)):null;
  if(!restored.process){restored.interviewDone=false;restored.reviewed=false;}
  restored.tools=list(input.tools,op,120).filter(t=>Object.hasOwn(TYPES,t.type)&&nameOk(t.name));
  restored.rules=list(input.rules,newRule(),10).filter(r=>Object.hasOwn(METHODS,r.method));
  restored.trial.manual=list(input.trial?.manual,manual,10).map(m=>({...m,state:Object.hasOwn(stateLabel,m.state)?m.state:"unknown"}));
  const runs=v=>Array.isArray(v)?list(v,run,10).filter(r=>Object.hasOwn(stateLabel,r.state)):null;
  restored.trial.first=runs(input.trial?.first);restored.trial.result=runs(input.trial?.result);
  restored.trial.history=Array.isArray(input.trial?.history)?input.trial.history.slice(0,120).map(h=>({date:q(h?.date),cause:q(h?.cause),first:runs(h?.first),result:runs(h?.result)})):[];
  restored.pendingPatch=input.pendingPatch&&Object.hasOwn(LAYERS,input.pendingPatch.layer)?clean(input.pendingPatch,issueDraft()):null;
  restored.notes=list(input.notes,{...issueDraft(),date:""},120).filter(n=>Object.hasOwn(LAYERS,n.layer));
  restored.surveys=list(input.surveys,{date:"",scores:[0,0,0,0],feedback:""},120);
  if(!Object.hasOwn(TYPES,restored.tool.type))restored.tool.type="template";
  if(!Object.hasOwn(LAYERS,restored.issue.layer))restored.issue.layer="process";
  return restored;
}

function requestEval(){
  const err=rulesError(s);if(err)return message(err);
  if(!q(s.trial.output)||!q(s.trial.used)||!q(s.trial.rebuilt)||!q(s.trial.next))return message("두 번째 실행 산출물, 사용 또는 재작성한 자료, 다음 후보를 기록해 주세요. 없으면 ‘없음’을 적으세요.");
  if(s.trial.first&&!proofPassed(s)){
    if(proofBlocked(s))return message("처음부터 결과가 어긋난 업무 단계와 이유를 먼저 기록해 주세요.");

  }
  const run=evaluateRun(s);
  if(!s.trial.first)s.trial.first=run;
  s.trial.result=run;
  if(countState(run,"fail")||countState(run,"unknown"))s.noIssue=false;
  render();
  if(proofBlocked(s))toast("세 항목 이상 실패했습니다. 원인이 된 업무 단계를 먼저 확인하세요.");
  else if(proofPassed(s))toast("모든 항목에 통과 근거를 기록했습니다.");
  else toast("실패 또는 미확인 항목의 근거를 보완해 다시 검증하세요.");
}

    const p=issuePlan();if(!p)return;
    s.pendingPatch=p;render();
    modal("수정안 재실행 준비",'<p class="intro">아래 요청문에 수정된 매뉴얼이 반영됐습니다. 같은 업무를 처음부터 실행해 수정 전후 증거를 수집하세요.</p>'+preview(formatRunPrompt("improvement"))+
      actions(btn("수정된 요청문 복사","copy-prompt",'data-key="improvement"','primary'),btn("닫기","close")));
  },
  "log-issue":logIssue,
  "no-issue":()=>{
    if(q(s.issue.issue)||s.pendingPatch)return message("작성 중인 수정 내용을 비우거나, 수정과 재실행을 기록하세요.");
    s.noIssue=true;go(5);
  },
  download:()=>{if(canExport(s))download(zip(s,exportFiles(s)),s.job.slug+".zip");},
  "download-skill":()=>{if(canExport(s))download(renderSkill(s),"SKILL.md");},
  "copy-file":()=>copyText(exportFiles(s).get(activeFile)),
  backup:()=>download(JSON.stringify(s,null,2),(s.job.slug||"delegation-workbench")+".json","application/json;charset=utf-8"),
  restore:()=>el("backup-input").click(),
  fresh:()=>{
    if((q(s.job.title)||q(s.job.context)||s.sources.length)&&!window.confirm("현재 매뉴얼을 지우고 새로 작성할까요? 필요한 경우 먼저 취소하고 백업하세요."))return;
    const surveys=s.surveys;s=blank();s.surveys=surveys;toolEdits.clear();render(true);
  },
  survey,
  "download-survey":()=>download(JSON.stringify(s.surveys,null,2),"usability-survey.json","application/json;charset=utf-8"),
  close:()=>el("modal").close()
};
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-action]");
  if(b&&!b.disabled&&Object.hasOwn(action,b.dataset.action))action[b.dataset.action](b);
});
document.addEventListener("input",e=>{
  const key=e.target.dataset.model;
  if(!key)return;
  const parts=key.split("."),leaf=parts.pop();
  const value=e.target.type==="checkbox"?e.target.checked:e.target.value;
  if(parts[0]==="tools"){
    const i=Number(parts[1]);
    const buffer=toolEdits.get(i)||{...s.tools[i]};buffer[leaf]=value;toolEdits.set(i,buffer);return;
  }
  let target=s;
  for(const p of parts){if(!target[p])target[p]=p.match(/^\d+$/)?{state:"unknown",evidence:""}:{};target=target[p];}
  if(target[leaf]===value)return;
  if(parts[0]==="rules"&&!canEditRules()){e.target.value=target[leaf];return;}
  target[leaf]=value;
  if(key==="job.title"||key==="job.slug"){
    if(s.reviewed){s.reviewed=false;resetProof(s,true);}
    nav();
  }
  if(key.startsWith("process.")){
    s.reviewed=false;resetProof(s,true);el("process-preview").innerHTML=preview(renderSkill(s));nav();
  }
  if(parts[0]==="answers"&&s.process){
    const keys=["trigger","inputs","steps","decisions","done","exceptions","tone","bad"];
    s.process[keys[Number(leaf)]]=value;s.reviewed=false;resetProof(s,true);nav();
  }
  if(parts[0]==="rules"){s.trial.manual=[];resetProof(s);el("proof-results").innerHTML='<p class="help">기준이 변경됐습니다. 전체 항목을 다시 검증하세요.</p>';nav();}
  if(key==="run1"||key==="skipTools"){resetProof(s,true);nav();}
  if(parts[0]==="issue"&&!["before","after","reran"].includes(leaf)){s.noIssue=false;if(leaf==="issue"&&!q(value))s.pendingPatch=null;nav();}
  if(parts[0]==="trial"){
    if(["trial.output","trial.used","trial.rebuilt","trial.next","trial.cause","trial.fix"].includes(key)||parts[1]==="manual"){
      if(key==="trial.output"&&s.trial.manual.length){
        s.trial.manual=[];
        for(const control of document.querySelectorAll('[data-model^="trial.manual."]')) control.value=control.tagName==="SELECT"?"unknown":"";
      }
      resetProof(s);
      const results=el("proof-results");
      if(results)results.innerHTML='<p class="help">판정에 사용한 입력이 변경됐습니다. 전체 항목을 다시 검증하세요.</p>';
      nav();
    }
  }
  if(key==="job.mode"&&el("folder-hint"))el("folder-hint").textContent=folderHint();
  save();
});
document.addEventListener("change",async e=>{
  const {id,dataset}=e.target;
  if(dataset.model?.endsWith(".method"))render();
  if(dataset.model==="issue.layer"){
    s.issue.target=s.issue.layer==="process"?"decisions":s.issue.layer==="proof"?"new":"";
    s.issue.change="";s.pendingPatch=null;render();
  }
  if(dataset.model==="trial.cause"){
    const output=document.querySelector('[data-model="trial.output"]');
    if(output)output.disabled=proofBlocked(s);
  }
  if(id==="open-file"){activeFile=e.target.value;el("final-preview").innerHTML=preview(exportFiles(s).get(activeFile));}
  if(id==="sources"){
    const files=Array.from(e.target.files),project=s,effects=[];
    for(const file of files){
      if(project.sources.length>=6){effects.push("최대 6개까지 첨부할 수 있습니다.");break;}
      if(file.size>204800||!/\.(txt|md|csv|json|log|tsv|yaml|yml)$/i.test(file.name)){effects.push(file.name+" · 지원 형식 또는 크기 확인");continue;}
      try{
        const text=await file.text();
        if(text.includes("\u0000")){effects.push(file.name+" · 텍스트로 읽을 수 없음");continue;}
        if(!project.sources.some(x=>x.name===file.name&&x.text===text))project.sources.push({name:file.name,text});
      }catch{effects.push(file.name+" · 파일 읽기 실패");}
    }
    if(project===s){render();toast(effects.join(" / ")||"텍스트 참고 자료를 추가했습니다.");}
  }
  if(id==="backup-input"){
    const file=e.target.files[0];e.target.value="";
    if(!file)return;
    try{
      if(file.size>12000000)throw Error("이 백업은 12 MB 이하여야 합니다.");
      const next=validateBackup(JSON.parse(await file.text()));
      if(q(s.job.title)&&!window.confirm("현재 매뉴얼을 불러온 백업으로 교체할까요?"))return;
      s=next;activeFile="SKILL.md";pending=null;toolEdits.clear();render(true);toast("매뉴얼을 불러왔습니다.");
    }catch(error){toast("백업을 불러올 수 없습니다. "+error.message);}
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="survey-form")return;
  e.preventDefault();const form=new FormData(e.target);
  const scores=[0,1,2,3].map(i=>Number(form.get("task"+i)));
  const feedback=q(form.get("feedback"));
  if(!scores.some(Boolean)&&!feedback)return message("해본 항목의 점수나 개선 의견을 적어 주세요.");
  s.surveys.unshift({date:today(),scores,feedback});save();el("modal").close();toast("사용성 응답을 저장했습니다.");
});
render();

</script>
</body>
</html>
