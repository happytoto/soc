name: Deploy to GitHub Pages

on:
  push:
    # github-pages 환경은 저장소 기본 브랜치에서만 배포를 허용한다.
    # 기본 브랜치가 main으로 바뀌기 전까지는 작업 브랜치에서 배포한다.
    branches: [main, claude/homepage-sales-example-t27l8g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # 기본 브랜치에서 온 실행만 배포한다. 다른 브랜치 실행은 건너뛰어 보호 규칙 실패와 상호 취소를 막는다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload site (static files as-is)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
